<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Track Shipment — Universal Logistics & International</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/bootstrap.min.css">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/theme.css">
<style>
  .awb-line{color:var(--v-slate-500); font-size:13px; margin-bottom:18px; font-family:var(--v-mono);}
  .status-badge{
    display:inline-block; padding:6px 16px; border-radius:24px;
    font-size:12px; font-weight:800; letter-spacing:0.4px; margin-bottom:22px; text-transform:uppercase;
  }
  .route-row{display:flex; align-items:center; gap:14px; margin-bottom:24px;}
  .route-point{flex:1;}
  .route-point .lbl{font-size:10.5px; color:var(--v-slate-500); text-transform:uppercase; letter-spacing:0.4px; font-weight:800;}
  .route-point .val{font-size:16px; font-weight:800; color:var(--v-slate-900); margin-top:4px;}
  .route-point .sub{font-size:12px; color:var(--v-slate-400); margin-top:1px;}
  .route-arrow{font-size:20px; color:var(--v-blue-500); flex-shrink:0;}

  .detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:6px;}
  .detail-item{background:var(--v-slate-50); border-radius:10px; padding:11px 13px;}
  .detail-item .lbl{font-size:10px; color:var(--v-slate-500); text-transform:uppercase; letter-spacing:.3px; font-weight:800;}
  .detail-item .val{font-size:14px; font-weight:800; color:var(--v-slate-900); margin-top:3px; font-family:var(--v-mono);}

  .updated-note{font-size:11.5px; color:var(--v-slate-400); margin-top:18px; text-align:center;}

  .track-search-row{display:flex; gap:10px; margin-bottom:22px;}
  #awbInput{
    flex:1; border:1.5px solid var(--v-slate-200); border-radius:10px;
    padding:12px 14px; font-size:14px; font-weight:600; font-family:var(--v-mono);
    letter-spacing:0.3px; outline:none; transition:border-color .15s ease;
  }
  #awbInput:focus{border-color:var(--v-blue-500);}
  #trackBtn{
    border:none; border-radius:10px; padding:12px 20px; font-size:14px; font-weight:800;
    background:var(--v-blue-500); color:#fff; cursor:pointer; white-space:nowrap;
  }
  #trackBtn:disabled{opacity:0.6; cursor:default;}
  .track-hint{font-size:12px; color:var(--v-slate-400); margin:-14px 0 22px; text-align:center;}
  .track-again{
    display:block; margin:20px auto 0; border:none; background:none; color:var(--v-blue-500);
    font-weight:800; font-size:13px; cursor:pointer; text-align:center;
  }

  .tl-wrap{margin:22px 0 6px;}
  .tl-heading{font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; color:var(--v-slate-500); margin-bottom:12px;}
  .tl-item{display:flex; gap:12px; position:relative;}
  .tl-dot-col{display:flex; flex-direction:column; align-items:center; width:12px; flex-shrink:0;}
  .tl-dot{width:11px; height:11px; border-radius:50%; background:var(--v-slate-300); margin-top:4px; flex-shrink:0;}
  .tl-item.current .tl-dot{background:var(--v-blue-500); box-shadow:0 0 0 4px rgba(26,86,196,.15);}
  .tl-line{flex:1; width:2px; background:var(--v-slate-200); margin:2px 0;}
  .tl-body{flex:1; padding-bottom:18px;}
  .tl-status{font-weight:800; font-size:13.5px; color:var(--v-slate-900);}
  .tl-item.current .tl-status{color:var(--v-blue-600, var(--v-blue-500));}
  .tl-meta{font-size:11.5px; color:var(--v-slate-400); margin-top:2px; font-family:var(--v-mono);}
</style>
<link rel="stylesheet" href="/css/tailwind.css">
</head>
<body class="v-track">

<div class="v-track-topbar">
  <div class="v-track-topbar-inner">
    <div class="v-track-logo"><img id="logoImg" alt="Universal Logistics & International" style="width:100%;height:100%;object-fit:cover;"></div>
    <div class="v-track-title">
      <div class="name">Universal Logistics &amp; International</div>
      <div class="tag">Track Your Shipment</div>
    </div>
  </div>
</div>

<div class="v-track-body">
  <div class="v-track-card" id="card">
    <div class="track-search-row">
      <input type="text" id="awbInput" placeholder="Enter your Airway Bill No. or Tracking No.">
      <button id="trackBtn">Track</button>
    </div>
    <div class="track-hint">Enter the number printed on your AWB slip here.</div>
    <div id="result"></div>
  </div>
</div>

<script src="/js/bootstrap.bundle.min.js"></script>
<script src="/js/templates.js"></script>
<script>
document.getElementById("logoImg").src = LOGO_ICON_DATA_URI;

function escapeHtml(s){
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function renderTimelineHtml(events){
  if(!events.length) return "";
  // Most recent checkpoint first, highlighted as the current stage.
  const ordered = [...events].reverse();
  const items = ordered.map((ev, i) => `
    <div class="tl-item ${i === 0 ? "current" : ""}">
      <div class="tl-dot-col">
        <div class="tl-dot"></div>
        ${i < ordered.length - 1 ? '<div class="tl-line"></div>' : ""}
      </div>
      <div class="tl-body">
        <div class="tl-status">${escapeHtml(ev.status)}${ev.country ? " — " + escapeHtml(ev.country) : ""}</div>
        <div class="tl-meta">${new Date(ev.eventTime.replace(" ", "T") + "Z").toLocaleString()}</div>
      </div>
    </div>
  `).join("");
  return `<div class="tl-wrap"><div class="tl-heading">Tracking History</div>${items}</div>`;
}

const resultEl = document.getElementById("result");
const inputEl = document.getElementById("awbInput");
const btnEl = document.getElementById("trackBtn");

async function trackShipment(query){
  query = String(query || "").trim();
  if(!query){
    resultEl.innerHTML = '<div class="empty-state">Please enter an Airway Bill No. or Tracking No. first.</div>';
    return;
  }

  btnEl.disabled = true;
  const prevLabel = btnEl.textContent;
  btnEl.textContent = "Searching...";
  resultEl.innerHTML = '<div class="empty-state">Loading...</div>';

  try{
    const res = await fetch(`/api/track/${encodeURIComponent(query)}`);
    if(!res.ok){
      resultEl.innerHTML = '<div class="empty-state">This shipment was not found. Please double-check the AWB number.</div>';
      return;
    }
    const s = await res.json();

    resultEl.innerHTML = `
      <h2>Shipment Tracking</h2>
      <div class="awb-line">AWB #${escapeHtml(s.awbnum || "—")}${s.trackingNo ? ` &middot; Tracking #${escapeHtml(s.trackingNo)}` : ""}${s.switchNo ? ` &middot; Switch #${escapeHtml(s.switchNo)}` : ""}</div>
      <div class="status-badge status-${escapeHtml(s.status)}">${escapeHtml(s.status)}</div>

      ${renderTimelineHtml(s.events || [])}

      <div class="route-row">
        <div class="route-point">
          <div class="lbl">From</div>
          <div class="val">${escapeHtml(s.shipperCity || s.shipperName || "—")}</div>
          <div class="sub">${escapeHtml(s.shipperCountry || "")}</div>
        </div>
        <div class="route-arrow">&#10230;</div>
        <div class="route-point">
          <div class="lbl">To</div>
          <div class="val">${escapeHtml(s.consigneeCity || s.consigneeName || "—")}</div>
          <div class="sub">${escapeHtml(s.consigneeCountry || "")}</div>
        </div>
      </div>

      <div class="detail-grid">
        <div class="detail-item"><div class="lbl">Pieces</div><div class="val">${escapeHtml(s.pieces || "—")}</div></div>
        <div class="detail-item"><div class="lbl">Weight</div><div class="val">${escapeHtml(s.weight || "—")} KG</div></div>
      </div>

      <div class="updated-note">Last updated: ${new Date(s.updated_at).toLocaleString()}</div>
      <button type="button" class="track-again" id="trackAgainBtn">Track another shipment</button>
    `;

    document.getElementById("trackAgainBtn").addEventListener("click", () => {
      inputEl.value = "";
      resultEl.innerHTML = "";
      inputEl.focus();
      const url = new URL(window.location);
      url.searchParams.delete("id");
      url.searchParams.delete("awb");
      window.history.replaceState({}, "", url);
    });

    // Keep the URL shareable/bookmarkable with whatever the person searched for.
    const url = new URL(window.location);
    url.searchParams.set("id", query);
    window.history.replaceState({}, "", url);
  }catch(err){
    resultEl.innerHTML = '<div class="empty-state">Network error — please reload the page.</div>';
  }finally{
    btnEl.disabled = false;
    btnEl.textContent = prevLabel;
  }
}

btnEl.addEventListener("click", () => trackShipment(inputEl.value));
inputEl.addEventListener("keydown", (e) => {
  if(e.key === "Enter") trackShipment(inputEl.value);
});

// If the page was opened with ?id=... or ?awb=... (e.g. from a QR code scan
// or a shared link), auto-fill and search immediately.
const params = new URLSearchParams(window.location.search);
const prefill = params.get("id") || params.get("awb");
if(prefill){
  inputEl.value = prefill;
  trackShipment(prefill);
}
</script>
</body>
</html>
