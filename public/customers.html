<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Manage Customers — Universal Logistics & International</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/bootstrap.min.css">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/theme.css">
<style>
  .add-card{background:#fff; border:1px solid var(--v-slate-200); border-radius:14px; padding:20px 22px; margin-bottom:22px; box-shadow:0 1px 3px rgba(15,23,42,.04);}
  .add-card h3{margin:0 0 14px; font-size:14.5px; font-weight:800; color:var(--v-slate-900);}
  .add-row{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;}
  .add-row > div{flex:1; min-width:180px;}
  .add-row label{display:block; font-size:10.5px; color:var(--v-slate-500); text-transform:uppercase; letter-spacing:.4px; font-weight:800; margin-bottom:5px;}
  .add-row input{width:100%; padding:9px 12px; border:1px solid var(--v-slate-200); border-radius:9px; font-size:13.5px; font-family:inherit;}
  .add-row input:focus{outline:none; border-color:var(--v-blue-500); box-shadow:0 0 0 3px rgba(59,130,246,.15);}
  .add-row button{
    padding:10px 20px; background:var(--v-slate-900); color:#fff; border:none; border-radius:9px;
    font-weight:700; font-size:13.5px; cursor:pointer; white-space:nowrap;
  }
  .add-row button:hover{background:#1e293b;}
  .msg{font-size:12.5px; margin-top:10px; display:none; padding:9px 12px; border-radius:8px;}
  .msg.error{background:var(--v-rose-50); color:var(--v-rose-700); display:block;}
  .msg.success{background:var(--v-emerald-50); color:var(--v-emerald-700); display:block;}
  .dash-head h2{margin:0; color:var(--v-slate-900); font-size:16.5px; font-weight:800;}
  .ship-table{width:100%; border-collapse:collapse;}
  .ship-table th{background:var(--v-slate-50); text-align:left; padding:11px 14px; font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--v-slate-500); font-weight:800; border-bottom:1px solid var(--v-slate-200);}
  .ship-table td{padding:11px 14px; font-size:13px; border-bottom:1px solid var(--v-slate-100);}
  .ship-table tr:not(:first-child):hover td{background:var(--v-slate-50);}
  .row-actions button{background:#fff; border:1px solid var(--v-rose-100); color:var(--v-rose-600); font-weight:600; border-radius:7px; padding:5px 12px; font-size:12px; cursor:pointer;}
  .row-actions button:hover{background:var(--v-rose-50);}
</style>
<link rel="stylesheet" href="/css/tailwind.css">
</head>
<body class="v-app">

<div class="app-shell">
  <div class="sidebar-scrim" id="sidebarScrim"></div>
  <aside class="app-sidebar" id="appSidebar">
    <div class="sidebar-brand">
      <span class="logo-box"><img id="logoImg" alt="Universal Logistics & International"></span>
      <span class="brand-text">
        <span class="d-block name">Universal Logistics</span>
        <span class="d-block tag">Admin Panel</span>
      </span>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section-lbl">Operations</div>
      <a class="sidebar-link" href="/dashboard.html">
        <span class="link-label"><span class="dot"></span><span>Dashboard</span></span>
      </a>
      <a class="sidebar-link active" href="/customers.html">
        <span class="link-label"><span class="dot"></span><span>Manage Customers</span></span>
        <span class="sidebar-badge blue" id="navCustCount">0</span>
      </a>
      <a class="sidebar-link" href="/form.html">
        <span class="link-label"><span class="dot"></span><span>New Shipment</span></span>
        <span class="sidebar-badge slate">Quick</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <span class="avatar" id="avatarLetter"></span>
      <span class="who">
        <span class="d-block nm" id="userName"></span>
        <span class="d-block rl">Admin</span>
      </span>
      <button class="logout-btn" id="logoutBtn" title="Logout">&#8594;|</button>
    </div>
  </aside>

  <div class="app-main">
    <header class="app-topbar">
      <div class="topbar-title">
        <button class="sidebar-toggle" id="sidebarToggle">&#9776;</button>
        <h1>Manage Customers</h1>
        <span class="status-live"><span class="dot-pulse"></span>Live</span>
      </div>
      <div class="topbar-actions">
        <a href="/dashboard.html" class="btn-v-outline">&larr; All Shipments</a>
      </div>
    </header>

    <div class="content-area" style="max-width:1100px;">
      <div class="add-card">
        <h3>+ Add New Customer</h3>
        <div class="add-row">
          <div><label>Full Name</label><input type="text" id="newName"></div>
          <div><label>Email</label><input type="email" id="newEmail"></div>
          <div><label>Password</label><input type="password" id="newPassword" placeholder="At least 6 characters"></div>
          <button id="addBtn">+ Add Customer</button>
        </div>
        <div class="msg" id="msgBox"></div>
      </div>

      <div class="dash-head mb-3">
        <h2>Customers (<span id="custCount">0</span>)</h2>
      </div>
      <div class="v-card">
        <div class="v-card-body p-0">
          <div id="listWrap">
            <div class="empty-state">Loading...</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/bootstrap.bundle.min.js"></script>
<script src="/js/templates.js"></script>
<script>
document.getElementById("logoImg").src = LOGO_ICON_DATA_URI;

const sidebarToggleBtn = document.getElementById("sidebarToggle");
const appSidebar = document.getElementById("appSidebar");
const sidebarScrim = document.getElementById("sidebarScrim");
if(sidebarToggleBtn){
  sidebarToggleBtn.addEventListener("click", ()=>{
    appSidebar.classList.toggle("open");
    sidebarScrim.classList.toggle("open");
  });
}
if(sidebarScrim) sidebarScrim.addEventListener("click", ()=>{
  appSidebar.classList.remove("open");
  sidebarScrim.classList.remove("open");
});

async function loadUser(){
  const res = await fetch("/api/auth/me");
  if(!res.ok){ window.location.href = "/login.html"; return null; }
  const data = await res.json();
  if(data.user.role !== "admin"){ window.location.href = "/my-shipments.html"; return null; }
  document.getElementById("userName").textContent = data.user.name;
  document.getElementById("avatarLetter").textContent = data.user.name.charAt(0).toUpperCase();
  return data.user;
}

async function loadCustomers(){
  const res = await fetch("/api/admin/customers");
  const data = await res.json();
  const wrap = document.getElementById("listWrap");
  document.getElementById("custCount").textContent = (data.customers || []).length;
  const navCount = document.getElementById("navCustCount");
  if(navCount) navCount.textContent = (data.customers || []).length;

  if(!data.customers || data.customers.length === 0){
    wrap.innerHTML = '<div class="empty-state">No customers added yet. Add your first customer using the form above.</div>';
    return;
  }

  const rows = data.customers.map(c => `
    <tr>
      <td>${escapeHtml(c.name)}</td>
      <td>${escapeHtml(c.email)}</td>
      <td>${new Date(c.created_at).toLocaleDateString()}</td>
      <td>
        <div class="row-actions">
          <button class="act-delete" data-id="${c.id}">Delete</button>
        </div>
      </td>
    </tr>
  `).join("");

  wrap.innerHTML = `
    <table class="ship-table">
      <tr><th>Name</th><th>Email</th><th>Added On</th><th>Actions</th></tr>
      ${rows}
    </table>
  `;

  wrap.querySelectorAll(".act-delete").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      if(!confirm("Delete this customer account? All of their bookings will also be deleted.")) return;
      const id = btn.getAttribute("data-id");
      await fetch(`/api/admin/customers/${id}`, { method:"DELETE" });
      loadCustomers();
    });
  });
}

function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

document.getElementById("addBtn").addEventListener("click", async ()=>{
  const name = document.getElementById("newName").value.trim();
  const email = document.getElementById("newEmail").value.trim();
  const password = document.getElementById("newPassword").value;
  const msgBox = document.getElementById("msgBox");
  msgBox.className = "msg";

  if(!name || !email || !password){
    msgBox.textContent = "Name, email, and password are all required.";
    msgBox.className = "msg error";
    return;
  }

  const res = await fetch("/api/admin/customers", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ name, email, password })
  });
  const data = await res.json();
  if(!res.ok){
    msgBox.textContent = data.error || "Could not add customer";
    msgBox.className = "msg error";
    return;
  }

  msgBox.textContent = `Customer add ho gaya! Login details unhe bhej dein — Email: ${email}`;
  msgBox.className = "msg success";
  document.getElementById("newName").value = "";
  document.getElementById("newEmail").value = "";
  document.getElementById("newPassword").value = "";
  loadCustomers();
});

document.getElementById("logoutBtn").addEventListener("click", async ()=>{
  await fetch("/api/auth/logout", { method:"POST" });
  window.location.href = "/login.html";
});

(async function init(){
  const user = await loadUser();
  if(user) loadCustomers();
})();
</script>
</body>
</html>
