<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Shipments — Universal Logistics & International</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/bootstrap.min.css">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/theme.css">
<style>
  .dash-head{display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .dash-head h2{margin:0; color:var(--v-slate-900); font-size:16.5px; font-weight:800;}

  .ship-table{width:100%; border-collapse:collapse;}
  .ship-table th{background:var(--v-slate-50); text-align:left; padding:11px 14px; font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--v-slate-500); font-weight:800; border-bottom:1px solid var(--v-slate-200);}
  .ship-table td{padding:11px 14px; font-size:13px; border-bottom:1px solid var(--v-slate-100);}
  .ship-table tr:not(:first-child):hover td{background:var(--v-slate-50);}
  .status-pill{display:inline-block; padding:3px 11px; border-radius:20px; font-size:10.5px; font-weight:800; letter-spacing:.3px; text-transform:uppercase;}
  .row-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .row-actions a, .row-actions button{
    font-size:12px; font-weight:600; border-radius:7px; padding:5px 11px; text-decoration:none; cursor:pointer;
  }
  .row-actions .act-edit{background:#fff; border:1px solid var(--v-slate-200); color:var(--v-slate-700);}
  .row-actions .act-edit:hover{background:var(--v-slate-50); border-color:var(--v-blue-500); color:var(--v-blue-600);}
  .row-actions .act-print{background:#fff; border:1px solid var(--v-emerald-100); color:var(--v-emerald-700);}
  .row-actions .act-print:hover{background:var(--v-emerald-50);}
  .row-actions .act-delete{background:#fff; border:1px solid var(--v-rose-100); color:var(--v-rose-600);}
  .row-actions .act-delete:hover{background:var(--v-rose-50);}
</style>
<link rel="stylesheet" href="/css/tailwind.css">
</head>
<body class="v-app">

<div class="app-shell">
  <div class="sidebar-scrim" id="sidebarScrim"></div>
  <aside class="app-sidebar" id="appSidebar">
    <div class="sidebar-brand">
      <span class="logo-box"><img id="logoImg" alt="Universal Logistics & International"></span>
      <span class="brand-text">
        <span class="d-block name">Universal Logistics</span>
        <span class="d-block tag">Customer Portal</span>
      </span>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section-lbl">My Account</div>
      <a class="sidebar-link active" href="/my-shipments.html">
        <span class="link-label"><span class="dot"></span><span>My Shipments</span></span>
        <span class="sidebar-badge blue" id="navShipCount">0</span>
      </a>
      <a class="sidebar-link" href="/form.html">
        <span class="link-label"><span class="dot"></span><span>New Shipment</span></span>
        <span class="sidebar-badge slate">Quick</span>
      </a>
      <a class="sidebar-link" href="/track.html">
        <span class="link-label"><span class="dot"></span><span>Track a Shipment</span></span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <span class="avatar" id="avatarLetter"></span>
      <span class="who">
        <span class="d-block nm" id="userName"></span>
        <span class="d-block rl">Customer</span>
      </span>
      <button class="logout-btn" id="logoutBtn" title="Logout">&#8594;|</button>
    </div>
  </aside>

  <div class="app-main">
    <header class="app-topbar">
      <div class="topbar-title">
        <button class="sidebar-toggle" id="sidebarToggle">&#9776;</button>
        <h1>My Shipments</h1>
        <span class="status-live"><span class="dot-pulse"></span>Live</span>
      </div>
      <div class="topbar-actions">
        <a href="/form.html" class="btn-v-primary">+ New Shipment</a>
      </div>
    </header>

    <div class="content-area" style="max-width:1100px;">
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="v-stat-card c-blue h-100"><div class="v-stat-lbl">Total Shipments</div><div class="v-stat-num" id="statTotal">0</div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="v-stat-card c-amber h-100"><div class="v-stat-lbl">Pending</div><div class="v-stat-num" id="statPending">0</div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="v-stat-card c-emerald h-100"><div class="v-stat-lbl">Confirmed</div><div class="v-stat-num" id="statConfirmed">0</div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="v-stat-card c-indigo h-100"><div class="v-stat-lbl">Shipped</div><div class="v-stat-num" id="statShipped">0</div></div>
        </div>
      </div>

      <div class="dash-head">
        <h2>Shipment History</h2>
      </div>

      <div class="v-card">
        <div class="v-card-body p-0">
          <div id="listWrap">
            <div class="empty-state">Loading...</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/bootstrap.bundle.min.js"></script>
<script src="/js/templates.js"></script>
<script>
document.getElementById("logoImg").src = LOGO_ICON_DATA_URI;

const sidebarToggleBtn = document.getElementById("sidebarToggle");
const appSidebar = document.getElementById("appSidebar");
const sidebarScrim = document.getElementById("sidebarScrim");
if(sidebarToggleBtn){
  sidebarToggleBtn.addEventListener("click", ()=>{
    appSidebar.classList.toggle("open");
    sidebarScrim.classList.toggle("open");
  });
}
if(sidebarScrim) sidebarScrim.addEventListener("click", ()=>{
  appSidebar.classList.remove("open");
  sidebarScrim.classList.remove("open");
});

async function loadUser(){
  const res = await fetch("/api/auth/me");
  if(!res.ok){ window.location.href = "/login.html"; return null; }
  const data = await res.json();
  if(data.user.role === "admin"){ window.location.href = "/dashboard.html"; return null; }
  document.getElementById("userName").textContent = data.user.name;
  document.getElementById("avatarLetter").textContent = data.user.name.charAt(0).toUpperCase();
  return data.user;
}

function updateStats(shipments){
  const counts = { Pending:0, Confirmed:0, Shipped:0, Cancelled:0 };
  shipments.forEach(s => { if(counts[s.status] !== undefined) counts[s.status]++; });
  document.getElementById("statTotal").textContent = shipments.length;
  document.getElementById("statPending").textContent = counts.Pending;
  document.getElementById("statConfirmed").textContent = counts.Confirmed;
  document.getElementById("statShipped").textContent = counts.Shipped;
  const navCount = document.getElementById("navShipCount");
  if(navCount) navCount.textContent = shipments.length;
}

async function loadShipments(){
  const wrap = document.getElementById("listWrap");
  let data;
  try{
    const res = await fetch("/api/shipments");
    if(!res.ok){
      let errMsg = "Could not load shipments (server error).";
      try{ const errData = await res.json(); errMsg = errData.error || errMsg; }catch(e){}
      wrap.innerHTML = `<div class="empty-state">${escapeHtml(errMsg)}</div>`;
      return;
    }
    data = await res.json();
  }catch(err){
    wrap.innerHTML = '<div class="empty-state">Network error — please reload the page and try again.</div>';
    return;
  }

  updateStats(data.shipments || []);

  if(!data.shipments || data.shipments.length === 0){
    wrap.innerHTML = '<div class="empty-state">No shipments created yet. Click "+ New Shipment" to get started.</div>';
    return;
  }

  const rows = data.shipments.map(s => `
    <tr>
      <td>${s.awbnum || "-"}</td>
      <td>${escapeHtml(s.consigneeName || "-")}</td>
      <td><span class="status-pill status-${s.status}">${s.status}</span></td>
      <td>${new Date(s.updated_at).toLocaleString()}</td>
      <td>
        <div class="row-actions">
          <a class="act-edit" href="/form.html?id=${s.id}">Edit</a>
          <a class="act-print" href="/print.html?id=${s.id}" target="_blank">Print</a>
          <button class="act-delete" data-id="${s.id}">Delete</button>
        </div>
      </td>
    </tr>
  `).join("");

  wrap.innerHTML = `
    <table class="ship-table">
      <tr>
        <th>AWB #</th>
        <th>Consignee</th>
        <th>Status</th>
        <th>Last Updated</th>
        <th>Actions</th>
      </tr>
      ${rows}
    </table>
  `;

  wrap.querySelectorAll(".act-delete").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      if(!confirm("Delete this shipment?")) return;
      const id = btn.getAttribute("data-id");
      await fetch(`/api/shipments/${id}`, { method:"DELETE" });
      loadShipments();
    });
  });
}

function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

document.getElementById("logoutBtn").addEventListener("click", async ()=>{
  await fetch("/api/auth/logout", { method:"POST" });
  window.location.href = "/login.html";
});

(async function init(){
  const user = await loadUser();
  if(user) loadShipments();
})();
</script>
</body>
</html>
